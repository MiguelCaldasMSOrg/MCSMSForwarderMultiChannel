name: Publish release
run-name: Publish release ${{ github.ref_name }}

# A SemVer tag builds, signs, verifies, and publishes the corresponding APK.

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and verify release assets
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Validate release version and signing credentials
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          version_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts)

          if [[ -z "$version_name" || -z "$version_code" ]]; then
            echo "Could not read versionName/versionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$version_name" ]]; then
            echo "Tag version '$tag_version' must match Android versionName '$version_name'" >&2
            exit 1
          fi
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PASSWORD" || -z "$ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS" || -z "$ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD" ]]; then
            echo "One or more release signing secrets are missing" >&2
            exit 1
          fi

          echo "Publishing Android version $version_name (code $version_code)"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/release-signing.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Run unit tests and assemble signed release APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Verify APK signature and stage release assets
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          test -f "$apk"
          test -n "$apksigner"
          "$apksigner" verify "$apk"

          mkdir release-assets
          cp "$apk" release-assets/MC.SMS.Forwarder.apk
          cd release-assets
          sha256sum MC.SMS.Forwarder.apk > MC.SMS.Forwarder.apk.sha256

      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            release-assets/MC.SMS.Forwarder.apk
            release-assets/MC.SMS.Forwarder.apk.sha256
          if-no-files-found: error

  publish-artifacts:
    name: Publish GitHub release assets
    needs: build-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: release-assets

      - name: Create GitHub release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/MC.SMS.Forwarder.apk release-assets/MC.SMS.Forwarder.apk.sha256 --verify-tag --title "MC SMS Forwarder (Multi-Channel) ${GITHUB_REF_NAME#v}" --generate-notes --latest