name: Publish release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Validate release' || 'Publish release' }} ${{ github.ref_name }}

# Manual runs validate signed APKs; only a SemVer tag publishes a release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and verify release assets
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Validate release version and signing credentials
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          version_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts)

          if [[ -z "$version_name" || -z "$version_code" ]]; then
            echo "Could not read versionName/versionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag '$GITHUB_REF_NAME' must use vMAJOR.MINOR.PATCH format" >&2
              exit 1
            fi
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version_name" ]]; then
              echo "Tag version '$tag_version' must match Android versionName '$version_name'" >&2
              exit 1
            fi
          fi
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PASSWORD" || -z "$ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS" || -z "$ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD" ]]; then
            echo "One or more release signing secrets are missing" >&2
            exit 1
          fi

          echo "Validating Android version $version_name (code $version_code)"

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Verify JDK 26 runtime
        run: |
          java -version
          ./gradlew --version
          java_version=$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p')
          test "$java_version" = "26"

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/release-signing.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Capture build timestamp
        run: echo "BUILD_TIMESTAMP_EPOCH_MILLIS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Run unit tests, lint, and assemble both signed release APKs
        run: ./gradlew :app:testDebugUnitTest :app:lint :app:assembleRelease :app:assembleMinifiedRelease --no-daemon

      - name: Build instrumentation APKs for the release matrix
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest -PandroidTestBuildType=release --no-daemon
          ./gradlew :device-tests:assembleDebug --no-daemon
          mkdir -p release-device-tests/regular release-device-tests/minified
          cp app/build/outputs/apk/release/app-release.apk release-device-tests/regular/app.apk
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk release-device-tests/regular/test.apk
          cp app/build/outputs/apk/minifiedRelease/app-minifiedRelease.apk release-device-tests/minified/app.apk
          cp device-tests/build/outputs/apk/debug/device-tests-debug.apk release-device-tests/ui-test.apk

      - name: Upload release device-test artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-device-tests-${{ github.ref_name }}
          path: release-device-tests/
          if-no-files-found: error
          retention-days: 14

      - name: Upload private R8 diagnostics
        uses: actions/upload-artifact@v7.0.1
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/minifiedRelease/
          if-no-files-found: error
          retention-days: 90

      - name: Verify APK signatures and stage release assets
        run: |
          standard_apk="app/build/outputs/apk/release/app-release.apk"
          minified_apk="app/build/outputs/apk/minifiedRelease/app-minifiedRelease.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)

          test -f "$standard_apk"
          test -f "$minified_apk"
          test -n "$apksigner"
          test -n "$aapt"
          "$apksigner" verify "$standard_apk"
          "$apksigner" verify "$minified_apk"
          minimum_sdk=$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["minSdk"])')
          for apk in "$standard_apk" "$minified_apk"; do
            badging=$("$aapt" dump badging "$apk")
            grep -Eq "^(minSdkVersion|sdkVersion):'${minimum_sdk}'$" <<< "$badging"
          done

          mkdir release-assets
          cp "$standard_apk" release-assets/MC.SMS.Forwarder.apk
          cp "$minified_apk" release-assets/MC.SMS.Forwarder.minified.apk
          gzip -9 -c app/build/outputs/mapping/minifiedRelease/mapping.txt > release-assets/MC.SMS.Forwarder.minified.mapping.txt.gz
          cd release-assets
          sha256sum MC.SMS.Forwarder.apk > MC.SMS.Forwarder.apk.sha256
          sha256sum MC.SMS.Forwarder.minified.apk > MC.SMS.Forwarder.minified.apk.sha256

      - name: Upload verified release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            release-assets/MC.SMS.Forwarder.apk
            release-assets/MC.SMS.Forwarder.apk.sha256
            release-assets/MC.SMS.Forwarder.minified.apk
            release-assets/MC.SMS.Forwarder.minified.apk.sha256
            release-assets/MC.SMS.Forwarder.minified.mapping.txt.gz
          if-no-files-found: error

  release-device-tests:
    name: Android API ${{ matrix.api-level }} / ${{ matrix.variant }}
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [30]
        variant: [regular, minified]
    steps:
      - name: Checkout test driver
        uses: actions/checkout@v7.0.1

      - name: Download exact release APKs and instrumentation
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-device-tests-${{ github.ref_name }}
          path: release-device-tests

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test released APK on Android
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level == 37 && '37.0' || format('{0}', matrix.api-level) }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -camera-back none -camera-front none
          script: bash tools/Run-ReleaseDeviceTests.sh ${{ matrix.variant }} ${{ matrix.api-level }}

      - name: Upload device-test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-${{ matrix.api-level }}-${{ matrix.variant }}-${{ github.ref_name }}
          path: device-test-results/
          if-no-files-found: warn
          retention-days: 30

  publish-artifacts:
    name: Publish GitHub release assets
    needs: [build-release, release-device-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release-assets

      - name: Create GitHub release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/MC.SMS.Forwarder.apk release-assets/MC.SMS.Forwarder.apk.sha256 release-assets/MC.SMS.Forwarder.minified.apk release-assets/MC.SMS.Forwarder.minified.apk.sha256 release-assets/MC.SMS.Forwarder.minified.mapping.txt.gz --verify-tag --title "MC SMS Forwarder (Multi-Channel) ${GITHUB_REF_NAME#v}" --generate-notes --latest